{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ site.BaseURL | safeJS }}#website",
  "url": "{{ site.BaseURL | safeJS }}",
  "name": "{{ site.Title | safeJS }}",
  "description": "{{ site.Params.description | default site.Title | safeJS }}",
  "publisher": {
    "@type": "Person",
    "name": "{{ site.Title | safeJS }}",
    "image": {
      "@type": "ImageObject",
      "url": "{{ site.Params.avatar | absURL | safeJS }}"
    }
  }
}
</script>
{{ else if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ .Permalink | safeJS }}"
  },
  "headline": "{{ .Title | safeJS }}",
  "description": "{{ .Description | default .Summary | safeJS }}",
  "datePublished": "{{ .PublishDate.Format "2006-01-02T15:04:05-07:00" | safeJS }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05-07:00" | safeJS }}",
  "author": {
    "@type": "Person",
    "name": "{{ site.Title | safeJS }}",
    "image": {
      "@type": "ImageObject",
      "url": "{{ site.Params.avatar | absURL | safeJS }}"
    }
  },
  "publisher": {
    "@type": "Person",
    "name": "{{ site.Title | safeJS }}",
    "image": {
      "@type": "ImageObject",
      "url": "{{ site.Params.avatar | absURL | safeJS }}"
    }
  }
}
</script>
{{ end }}
